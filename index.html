<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Review</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <div class="container">

        <h1 class="title">Our Reviews</h1>

        <div class="card">

            <div class="image-box">
                <img src="./assets/github.jfif" alt="profile" id="image">
            </div>

            <h2 id="name">John Smith</h2>

            <h4 id="profession">Frontend Developer</h4>

            <p id="description">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Quidem veniam consequatur porro, molestiae doloremque
                ratione quas magni natus neque saepe.
            </p>

            <div class="buttons">
                <i class="ri-arrow-left-s-line" onclick="handlePrevious()"></i>
                <i class="ri-arrow-right-s-line" onclick="handleNext()"></i>
            </div>

            <button class="surprise-btn">Surprise Me</button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="./app.js"></script>

</body>

</html>
